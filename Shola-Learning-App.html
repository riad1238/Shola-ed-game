<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shola School Learning App</title>
<style>
:root{font-family:Arial,sans-serif;color:#172a45;background:#f3f7fc}*{box-sizing:border-box}body{margin:0}header{background:#17345b;color:white;padding:20px}header>div,main{max-width:1050px;margin:auto}header>div{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}h1{margin:0 0 6px}p{line-height:1.45}select,button{font:inherit;border-radius:10px;padding:10px;border:1px solid #ccd7e5}main{display:grid;grid-template-columns:220px 1fr;gap:16px;padding:18px 12px}.box{background:white;border:1px solid #e0e7f0;border-radius:16px;padding:16px;box-shadow:0 4px 15px #19365c0c}aside h2,.box h2{margin-top:0}.grades{display:grid;grid-template-columns:1fr 1fr;gap:7px}.grade,.subject,.answer{cursor:pointer;background:white;color:#172a45}.grade.active,.subject.active{background:#eaf3ff;border:2px solid #2868c7}.grade{padding:9px 4px}.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:15px}.subject{min-height:78px;font-weight:bold;text-align:start}.subject span{display:block;font-size:1.4rem;margin-bottom:6px}.question{font-size:1.2rem;line-height:1.5;margin:16px 0}.answers{display:grid;gap:9px}.answer{text-align:start;padding:13px}.answer.correct{background:#e6f7ee;border-color:#16845b}.answer.wrong{background:#fff0f1;border-color:#c33b4b}.feedback{min-height:25px;font-weight:bold;margin:12px 0}.actions{display:flex;gap:9px;flex-wrap:wrap}.primary{background:#2868c7;color:white;border:0;font-weight:bold}.secondary{background:#eaf0f8;color:#25436c}.muted{color:#66758a;font-size:.9rem}.pill{background:#edf3fb;padding:7px 10px;border-radius:30px;font-size:.85rem}.headrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}footer{text-align:center;padding:0 12px 22px;color:#66758a;font-size:.9rem}[dir=rtl] .subject,[dir=rtl] .answer{text-align:right}@media(max-width:680px){main{grid-template-columns:1fr}.grades{grid-template-columns:repeat(5,1fr)}.subjects{gap:6px}.subject{font-size:.88rem;padding:8px}}
</style></head><body>
<header><div><section><h1>📚 <span id="title">Shola School Learning App</span></h1><p id="subtitle">Learn, practise, and grow every day!</p></section><section><label id="langLabel" for="language">Language / اللغة</label><br><select id="language"><option value="en">English</option><option value="ar">العربية</option></select></section></div></header>
<main><aside class="box"><h2 id="gradeTitle">Choose your grade</h2><div class="grades" id="grades"></div><label id="diffTitle" for="difficulty">Difficulty</label><select id="difficulty" style="width:100%;margin-top:8px"><option value="easy">Easy</option><option value="medium">Medium</option><option value="hard">Challenge</option></select><p class="muted" id="tip">Choose a grade and difficulty to adjust the questions.</p></aside>
<section><div class="subjects" id="subjects"></div><section class="box"><div class="headrow"><h2 id="subjectTitle">Arabic</h2><span class="pill" id="progress">Question 1</span></div><div id="quiz"></div><div class="actions"><button class="primary" id="next" disabled>Next question →</button><button class="secondary" id="restart">Start again</button></div><p class="muted" id="score"></p></section></section></main><footer id="footer">Made for curious learners. Keep practising!</footer>
<script>
const data={
en:{
Arabic:[
[1,"easy","Which letter begins the word أسد?",["أ","ب","ت"],0],[2,"easy","Which word means “book”?",["قلم","كتاب","باب"],1],[3,"medium","What is the plural of طالب?",["طلاب","طالبة","مدرسة"],0],[4,"medium","Choose the opposite of سريع.",["قريب","بطيء","جميل"],1],[5,"hard","Which sentence is a question?",["ما أجمل السماء!","أين تسكن؟","الجو جميل."],1],[1,"easy","Which is an Arabic letter?",["م","7","B"],0],[3,"medium","Which word means school?",["مدرسة","تفاحة","قلم"],0],[5,"hard","In «قرأ الولد الكتاب», who read the book?",["الكتاب","الولد","قرأ"],1]],
Islamic:[
[1,"easy","How many daily prayers do Muslims pray?",["3","5","7"],1],[2,"easy","What is the holy book of Islam?",["The Qur’an","A map","A dictionary"],0],[3,"medium","In which month do Muslims fast?",["Ramadan","Safar","Muharram only"],0],[4,"medium","What direction do Muslims face in prayer?",["The Qiblah","The North Pole","Any mountain"],0],[5,"hard","What is Zakat?",["A form of required charity","A map","A school lesson"],0],[1,"easy","Which greeting means peace be upon you?",["As-salamu alaykum","Good night","Thank you"],0],[3,"medium","Which prophet built the Ark?",["Nuh (Noah)","Musa (Moses)","Yunus (Jonah)"],0],[5,"hard","What is the pilgrimage to Makkah called?",["Hajj","Hijrah","Adhan"],0]],
Geography:[
[1,"easy","Which planet do we live on?",["Earth","Mars","The Moon"],0],[2,"easy","What helps us find places?",["A map","A spoon","A pillow"],0],[3,"medium","What is the world's largest ocean?",["Pacific Ocean","Arctic Ocean","Indian Ocean"],0],[4,"medium","What is the capital of the UAE?",["Abu Dhabi","Dubai","Al Ain"],0],[5,"hard","Which line divides Earth into Northern and Southern Hemispheres?",["Equator","Prime Meridian","Tropic of Cancer"],0],[1,"easy","Which place has salty water?",["Sea","Desert","Forest"],0],[3,"medium","What is opposite to north?",["South","East","West"],0],[5,"hard","Which continent contains the Sahara Desert?",["Africa","Europe","South America"],0]]},
ar:{
Arabic:[
[1,"easy","بأي حرف تبدأ كلمة أسد؟",["أ","ب","ت"],0],[2,"easy","أي كلمة تعني شيئًا نقرأ فيه؟",["قلم","كتاب","باب"],1],[3,"medium","ما جمع كلمة طالب؟",["طلاب","طالبة","مدرسة"],0],[4,"medium","ما عكس كلمة سريع؟",["قريب","بطيء","جميل"],1],[5,"hard","أي جملة تنتهي بعلامة استفهام؟",["ما أجمل السماء!","أين تسكن؟","الجو جميل."],1],[1,"easy","أي مما يلي حرف عربي؟",["م","7","B"],0],[3,"medium","أي كلمة تدل على مكان للتعلم؟",["مدرسة","تفاحة","قلم"],0],[5,"hard","في جملة «قرأ الولد الكتاب»، من قرأ الكتاب؟",["الكتاب","الولد","قرأ"],1]],
Islamic:[
[1,"easy","كم صلاة يصلي المسلمون في اليوم؟",["3","5","7"],1],[2,"easy","ما الكتاب المقدس في الإسلام؟",["القرآن الكريم","الخريطة","القاموس"],0],[3,"medium","في أي شهر يصوم المسلمون؟",["رمضان","صفر","محرم فقط"],0],[4,"medium","إلى أين يتجه المسلمون في الصلاة؟",["القبلة","القطب الشمالي","أي جبل"],0],[5,"hard","ما الزكاة؟",["نوع من الصدقة الواجبة","خريطة","درس مدرسي"],0],[1,"easy","أي تحية تعني السلام عليكم؟",["السلام عليكم","تصبح على خير","شكرًا"],0],[3,"medium","أي نبي صنع السفينة؟",["نوح عليه السلام","موسى عليه السلام","يونس عليه السلام"],0],[5,"hard","ما اسم الرحلة الدينية إلى مكة؟",["الحج","الهجرة","الأذان"],0]],
Geography:[
[1,"easy","ما الكوكب الذي نعيش عليه؟",["الأرض","المريخ","القمر"],0],[2,"easy","ماذا نستخدم لمعرفة الأماكن؟",["الخريطة","الملعقة","الوسادة"],0],[3,"medium","ما أكبر محيط في العالم؟",["المحيط الهادئ","المتجمد الشمالي","المحيط الهندي"],0],[4,"medium","ما عاصمة الإمارات العربية المتحدة؟",["أبوظبي","دبي","العين"],0],[5,"hard","ما الخط الذي يقسم الأرض إلى نصفين شمالي وجنوبي؟",["خط الاستواء","خط غرينتش","مدار السرطان"],0],[1,"easy","أي مكان يحتوي على مياه مالحة؟",["البحر","الصحراء","الغابة"],0],[3,"medium","ما الاتجاه المعاكس للشمال؟",["الجنوب","الشرق","الغرب"],0],[5,"hard","في أي قارة تقع الصحراء الكبرى؟",["أفريقيا","أوروبا","أمريكا الجنوبية"],0]]}};
const words={en:{grades:["Grade 1","Grade 2","Grade 3","Grade 4","Grade 5"],grade:"Choose your grade",difficulty:"Difficulty",easy:"Easy",medium:"Medium",hard:"Challenge",tip:"Choose a grade and difficulty to adjust the questions.",Arabic:"Arabic",Islamic:"Islamic Studies",Geography:"Geography",next:"Next question →",check:"Check answer",restart:"Start again",correct:"Correct! Great job! ⭐",wrong:"Not quite. Try the next one!",question:"Question",of:"of",score:"Score",done:"Quiz complete! Great work!",choose:"Choose an answer.",footer:"Made for curious learners. Keep practising!",subtitle:"Learn, practise, and grow every day!"},
ar:{grades:["الصف الأول","الصف الثاني","الصف الثالث","الصف الرابع","الصف الخامس"],grade:"اختر صفك الدراسي",difficulty:"مستوى الصعوبة",easy:"سهل",medium:"متوسط",hard:"تحدّي",tip:"اختر الصف ومستوى الصعوبة لتتغير الأسئلة.",Arabic:"اللغة العربية",Islamic:"التربية الإسلامية",Geography:"الجغرافيا",next:"السؤال التالي ←",check:"تحقّق من الإجابة",restart:"ابدأ من جديد",correct:"إجابة صحيحة! أحسنت! ⭐",wrong:"ليست صحيحة، حاول في السؤال التالي!",question:"السؤال",of:"من",score:"النتيجة",done:"أكملت الاختبار! عمل رائع!",choose:"اختر إجابة.",footer:"واصل التعلّم والتدريب!",subtitle:"تعلّم وتدرّب وتقدّم كل يوم!"}};
let lang="en",grade=1,subject="Arabic",idx=0,points=0,answered=false,qs=[];
const $=id=>document.getElementById(id), t=k=>words[lang][k]||k;
function build(){document.documentElement.lang=lang;document.documentElement.dir=lang==="ar"?"rtl":"ltr";$("subtitle").textContent=t("subtitle");$("gradeTitle").textContent=t("grade");$("diffTitle").textContent=t("difficulty");$("tip").textContent=t("tip");$("footer").textContent=t("footer");let old=$("difficulty").value;$("difficulty").innerHTML=["easy","medium","hard"].map(x=>`<option value="${x}">${t(x)}</option>`).join("");$("difficulty").value=old;$("grades").innerHTML=t("grades").map((x,i)=>`<button class="grade ${grade===i+1?"active":""}" data-g="${i+1}">${x}</button>`).join("");$("subjects").innerHTML=[["Arabic","🔤"],["Islamic","🕌"],["Geography","🌍"]].map(([x,e])=>`<button class="subject ${subject===x?"active":""}" data-s="${x}"><span>${e}</span>${t(x)}</button>`).join("");$("grades").querySelectorAll("button").forEach(b=>b.onclick=()=>{grade=+b.dataset.g;reset()});$("subjects").querySelectorAll("button").forEach(b=>b.onclick=()=>{subject=b.dataset.s;reset()})}
function chooseQs(){let all=data[lang][subject],d=$("difficulty").value;let a=all.filter(q=>q[0]===grade&&q[1]===d);if(a.length<2)a=all.filter(q=>q[0]===grade);return a.length?a:all}
function reset(){idx=0;points=0;qs=chooseQs();build();show()}
function show(){qs=chooseQs();answered=false;let q=qs[idx];$("subjectTitle").textContent=t(subject);$("progress").textContent=`${t("question")} ${idx+1} ${t("of")} ${qs.length}`;$("quiz").innerHTML=`<div class="question">${q[2]}</div><div class="answers">${q[3].map((a,i)=>`<button class="answer" data-a="${i}">${String.fromCharCode(65+i)}. ${a}</button>`).join("")}</div><div id="feedback" class="feedback">${t("choose")}</div>`;$("quiz").querySelectorAll(".answer").forEach(b=>b.onclick=()=>{if(answered)return;answered=true;let pick=+b.dataset.a;$("quiz").querySelectorAll(".answer").forEach((el,i)=>{el.disabled=true;if(i===q[4])el.classList.add("correct");if(i===pick&&pick!==q[4])el.classList.add("wrong")});if(pick===q[4])points++;$("feedback").textContent=pick===q[4]?t("correct"):t("wrong");$("next").disabled=false;$("next").textContent=idx===qs.length-1?t("done"):t("next");$("score").textContent=`${t("score")}: ${points} / ${idx+1}`});$("next").disabled=true;$("next").textContent=t("next");$("score").textContent=`${t("score")}: ${points} / ${idx}`}
$("language").onchange=e=>{lang=e.target.value;reset()};$("difficulty").onchange=reset;$("restart").onclick=reset;$("next").onclick=()=>{if(!answered)return;if(idx<qs.length-1){idx++;show()}else{$("quiz").innerHTML=`<div class="question">${t("done")}</div><p>${t("score")}: ${points} / ${qs.length}</p>`;$("next").disabled=true;$("progress").textContent=t("done")}};build();reset();
</script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17345b">
  <title>Shola Apps</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; font: 16px/1.5 Arial, sans-serif; color: #172a45; background: #f3f7fc; }
    .topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px clamp(12px, 3vw, 28px); background: #17345b; color: white; box-shadow: 0 2px 8px #10264133; }
    .brand { margin-right: auto; font-size: 1.15rem; font-weight: 700; white-space: nowrap; }
    .tab { padding: 10px 12px; border: 1px solid #ffffff66; border-radius: 8px; color: white; background: transparent; font: inherit; cursor: pointer; }
    .tab:hover, .tab[aria-current="page"] { color: #17345b; background: white; }
    .tab:focus-visible { outline: 3px solid #ffd84b; outline-offset: 2px; }
    .app-frame { flex: 1; width: 100%; min-height: calc(100vh - 66px); border: 0; background: white; }
    .status { padding: 6px 16px; background: #e6eef8; color: #35536f; font-size: .85rem; }
    @media (max-width: 700px) { .topbar { align-items: stretch; } .brand { width: 100%; } .tab { flex: 1; padding: 9px 6px; font-size: .88rem; } }
  </style>
</head>
<body>
  <nav class="topbar" aria-label="Shola apps">
    <span class="brand">📚 Shola Apps</span>
    <button class="tab" type="button" data-page="index.html" aria-current="page">Village Game</button>
    <button class="tab" type="button" data-page="Shola-Learning-App.html">Learning Quiz</button>
    <button class="tab" type="button" data-page="Ask-AI.html">Ask AI</button>
    <button class="tab" type="button" data-page="character-preview.html">Heroes</button>
  </nav>
  <div class="status" id="status" role="status" aria-live="polite">Choose an app to get started.</div>
  <iframe class="app-frame" id="appFrame" title="Shola app" src="index.html"></iframe>
  <script>
    (() => {
      const frame = document.getElementById('appFrame');
      const status = document.getElementById('status');
      const tabs = [...document.querySelectorAll('.tab')];
      const pageNames = {
        'index.html': 'Village Game',
        'Shola-Learning-App.html': 'Learning Quiz',
        'Ask-AI.html': 'Ask AI',
        'character-preview.html': 'Heroes'
      };

      function connectGameAddons() {
        let childDocument;
        try { childDocument = frame.contentDocument; } catch { return; }
        if (!childDocument || !childDocument.body || frame.getAttribute('src') !== 'index.html') return;

        // The game is a standalone page; attach its optional add-ons after its inline game code runs.
        for (const source of ['theme.js', 'level-lock.js']) {
          const scriptId = `shola-addon-${source.replace(/[^a-z0-9]/gi, '-')}`;
          if (childDocument.getElementById(scriptId)) continue;
          const script = childDocument.createElement('script');
          script.id = scriptId;
          script.src = source;
          childDocument.body.appendChild(script);
        }
      }

      frame.addEventListener('load', connectGameAddons);
      tabs.forEach((tab) => tab.addEventListener('click', () => {
        const page = tab.dataset.page;
        if (frame.getAttribute('src') !== page) frame.src = page;
        tabs.forEach((item) => {
          if (item === tab) item.setAttribute('aria-current', 'page');
          else item.removeAttribute('aria-current');
        });
        status.textContent = `${pageNames[page]} is open.`;
      }));
    })();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LearnQuest Village Runner</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

      :root {
        --sky: #9ae7ff;
        --sky-deep: #77d4ff;
        --grass: #6edc5a;
        --grass-dark: #2c9a42;
        --ground: #9b6b39;
        --wood: #b26a2d;
        --panel: #fff7d6;
        --panel-border: #cb9d43;
        --brown: #6b3e1d;
        --red: #f94e4e;
        --blue: #4fa3ff;
        --yellow: #ffd84b;
        --text: #18314a;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        background: linear-gradient(#dff9ff 0%, #dff9ff 65%, #7edb58 65%, #5ac93e 100%);
        color: var(--text);
        font-family: 'Press Start 2P', monospace;
        image-rendering: pixelated;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        overflow-x: hidden;
        overflow-y:  auto;
      }
      button {
        font: inherit;
        cursor: pointer;
      }
      .hidden { display: none !important; }
      .global-bar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:110;display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center;width:min(96vw,1000px);padding:8px 10px;background:#17345beF;border:2px solid #f2d77e;border-radius:14px;box-shadow:0 5px 18px #10243d55}
      .global-bar button{font:inherit;font-size:10px;padding:9px 12px;border:2px solid #f2d77e;border-radius:8px;background:#fff7d6;color:#18314a}
      .global-bar button.active{background:#ff9a72;color:#fff} #navSchool{display:none}
      .global-bar .spacer{flex:1}
      .school-screen{display:block;position:fixed;inset:0;padding:74px 0 0;background:#f3f7fc}
      .school-screen iframe{width:100%;height:calc(100% - 0px);border:0;background:#f3f7fc}
      .results-screen{background:linear-gradient(#dff9ff 0%,#dff9ff 65%,#7edb58 65%,#5ac93e 100%)}
      .results-card{width:min(720px,92vw);padding:clamp(24px,5vw,48px);text-align:center;background:linear-gradient(#fff9dd,#f5e4a8);border:8px solid #d1a34d;box-shadow:0 0 0 8px #7b643a4d,0 14px 0 #56402170}
      .results-score{font-size:clamp(30px,6vw,56px);color:#e85c4a;margin:20px 0}
      .results-actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:22px}
      .player .avatar-face{font-size:28px;line-height:1}
      .hero-avatar{width:76px;height:88px;display:grid;place-items:center;font-size:42px;border:4px solid #382a35;border-radius:42% 42% 24% 24%;box-shadow:inset 0 -12px #0002,4px 5px #382a3528;background:linear-gradient(145deg,#fff,var(--hero-color,#ffd84b));position:relative}
      .hero-avatar:before{content:"";position:absolute;top:-12px;left:9px;right:9px;height:19px;border:4px solid #382a35;border-radius:12px 12px 3px 3px;background:var(--hero-accent,#ef7041)}
      .hero-avatar:after{content:"••";position:absolute;top:26px;left:18px;letter-spacing:10px;font:16px Arial;color:#382a35}
      .option-card .hero-avatar{margin:4px auto}
      html[dir="rtl"] .global-bar{direction:rtl}
      @media(max-width:600px){.global-bar{top:4px;gap:4px;padding:5px}.global-bar button{font-size:8px;padding:7px}.school-screen{padding-top:68px}}

      .screen {
        width: 100vw;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .title-screen {
        background: linear-gradient(#9fe8ff, #c4f0ff 62%, #b9ef9f 62%, #7fe166 100%);
        position: relative;
        overflow: hidden;
      }
      .title-screen::before,
      .title-screen::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 12px;
        background: repeating-linear-gradient(90deg, #d4b058 0 16px, #8e6a2a 16px 32px);
        bottom: 52px;
      }
      .title-screen::after {
        bottom: 0;
        height: 48px;
        background: linear-gradient(#d4a55a, #b87a31);
      }
      .pixel-box {
        position: relative;
        width: min(980px, 92vw);
        height: min(600px, 80vh);
        background: linear-gradient(#7bd9ff, #bfeeff 58%, #d7f7ff 58%, #a8e5c9 100%);
        border: 8px solid #7f532d;
        box-shadow: 0 0 0 8px #c08d4a, 0 14px 0 rgba(72, 53, 32, 0.5);
        overflow: hidden;
      }
      .cloud {
        position: absolute;
        width: 88px;
        height: 30px;
        background: rgba(255,255,255,0.82);
        border: 3px solid rgba(140, 193, 214, 0.5);
        border-radius: 20px;
        box-shadow: 30px 0 0 rgba(255,255,255,0.75), 60px 0 0 rgba(255,255,255,0.7);
      }
      .cloud.c1 { top: 40px; left: 120px; }
      .cloud.c2 { top: 70px; right: 180px; transform: scale(1.3); }
      .cloud.c3 { top: 110px; left: 450px; transform: scale(0.8); }
      .hill {
        position: absolute;
        bottom: 54px;
        width: 420px;
        height: 180px;
        background: linear-gradient(#73d97d, #4ab75e);
        border-radius: 50% 50% 0 0;
        border: 5px solid rgba(52, 132, 62, 0.5);
      }
      .hill.h1 { left: -40px; }
      .hill.h2 { right: -30px; width: 500px; }
      .title-block {
        position: absolute;
        left: 50%;
        top: 100px;
        transform: translateX(-50%);
        text-align: center;
      }
      .super {
        font-size: clamp(20px, 3vw, 42px);
        color: #7ed1ff;
        text-shadow: 4px 0 0 #f0f7ff, -4px 0 0 #f0f7ff, 0 4px 0 #f0f7ff, 0 -4px 0 #f0f7ff, 4px 4px 0 #000;
        letter-spacing: 2px;
      }
      .mario-world {
        margin-top: 8px;
        font-size: clamp(30px, 5vw, 86px);
        line-height: 0.9;
        letter-spacing: 2px;
        color: #ffec4a;
        text-shadow: 4px 0 0 #ff774d, -4px 0 0 #ff774d, 0 4px 0 #ff774d, 0 -4px 0 #ff774d, 4px 4px 0 #000;
        transform: scaleY(1.3);
      }
      .menu {
        position: absolute;
        left: 50%;
        bottom: 110px;
        transform: translateX(-50%);
        display: grid;
        gap: 14px;
        justify-items: center;
      }
      .menu-btn {
        min-width: 410px;
        padding: 18px 26px;
        background: linear-gradient(#fef7cf, #f2d77e);
        border: 5px solid #7c5c3d;
        box-shadow: 0 8px 0 rgba(95, 64, 33, 0.4);
        color: var(--text);
        font-size: clamp(10px, 1.3vw, 18px);
        line-height: 1.5;
        text-transform: uppercase;
        transition: transform 0.12s ease;
      }
      .menu-btn:hover { transform: translateY(-2px); }
      .menu-btn.small { min-width: 250px; }
      .copyright {
        position: absolute;
        left: 50%;
        bottom: 28px;
        transform: translateX(-50%);
        font-size: 12px;
        color: var(--text);
        text-shadow: 2px 2px 0 rgba(255,255,255,0.6);
      }

      .selection-screen {
        background: linear-gradient(#d9f8ff, #a5e8ff 58%, #d9f0ff 58%, #d5f2a5 100%);
      }
      .panel {
        width: min(980px, 93vw);
        background: linear-gradient(#fff9dd, #f5e4a8);
        border: 8px solid #d1a34d;
        box-shadow: 0 0 0 8px rgba(123, 100, 58, 0.3), 0 14px 0 rgba(86, 64, 33, 0.44);
        padding: 28px 24px 20px;
      }
      .panel-header {
        margin: 0 0 18px;
        text-align: center;
        font-size: clamp(18px, 2.2vw, 38px);
        color: var(--text);
        text-transform: uppercase;
      }
      .mode-row {
        display: flex;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 22px;
      }
      .mode-btn {
        padding: 14px 18px;
        border: 5px solid #7f4a2d;
        background: linear-gradient(#fef7d6, #ebd79d);
        color: var(--text);
        box-shadow: 0 8px 0 rgba(83, 56, 35, 0.5);
        font-size: 12px;
        text-transform: uppercase;
      }
      .mode-btn.active {
        background: linear-gradient(#ff9a72, #ff5d5d);
        color: white;
      }
      .selector-grid {
        display: grid;
        gap: 18px;
      }
      .character-grid, .subject-grid, .level-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(190px, 1fr));
        gap: 18px;
      }
      .option-card {
        background: linear-gradient(#fdfdf7, #f1ebd0);
        border: 5px solid #8aa1be;
        min-height: 150px;
        padding: 18px 18px 16px;
        text-align: left;
        display: grid;
        align-content: start;
        gap: 12px;
        color: var(--text);
        transition: transform 0.12s ease, border-color 0.12s ease, box-shadow 0.12s ease;
      }
      .option-card.active {
        border-color: #ff5d5d;
        box-shadow: 0 0 0 4px rgba(255, 92, 92, 0.1);
        background: linear-gradient(#fff3bb, #ffd884);
      }
      .option-card:hover { transform: translateY(-2px); }
      .option-emoji { font-size: 42px; }
      .option-title { font-size: clamp(14px, 1.7vw, 24px); }
      .option-sub {
        font-size: 10px;
        line-height: 1.7;
        color: #35536f;
      }
      .selection-actions {
        display: flex;
        justify-content: center;
        gap: 18px;
        margin-top: 22px;
      }
      .primary-btn, .secondary-btn {
        padding: 18px 26px;
        border: 5px solid #7f4a2d;
        box-shadow: 0 8px 0 rgba(83, 56, 35, 0.5);
        font-size: 12px;
        text-transform: uppercase;
      }
      .primary-btn {
        background: linear-gradient(#ff9a72, #ff5d5d);
        color: white;
      }
      .secondary-btn {
        background: linear-gradient(#fef7d6, #ebd79d);
        color: var(--text);
      }

      .game-screen {
        position: relative;
        background: linear-gradient(#89dfff 0%, #97e5ff 62%, #7ee46b 62%, #53c948 100%);
        overflow: hidden;
      }
      .game-shell {
        width: min(980px, 94vw);
        height: min(620px, 84vh);
        position: relative;
        border: 8px solid #8a5b2f;
        box-shadow: 0 0 0 8px rgba(104, 82, 46, 0.34), 0 16px 0 rgba(91, 69, 38, 0.44);
        background: linear-gradient(#7ad7ff 0%, #bdf6ff 58%, #7be36e 58%, #57ce57 100%);
        overflow: hidden;
      }
      .hud {
        position: absolute;
        top: 14px;
        left: 14px;
        right: 14px;
        z-index: 20;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-size: 12px;
      }
      .hud-box {
        background: rgba(255,255,255,0.18);
        border: 4px solid rgba(31, 58, 84, 0.4);
        padding: 8px 12px;
        color: var(--text);
      }
      .hud-right {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .heart { font-size: 20px; color: #ff4b5e; }

      .world {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .cloud-sm {
        position: absolute;
        width: 90px;
        height: 26px;
        background: rgba(255,255,255,0.7);
        border-radius: 18px;
        box-shadow: 26px 0 0 rgba(255,255,255,0.75), 52px 0 0 rgba(255,255,255,0.7);
      }
      .cloud-sm.one { left: 80px; top: 70px; }
      .cloud-sm.two { left: 450px; top: 92px; }
      .cloud-sm.three { right: 130px; top: 70px; }
      .hill-large {
        position: absolute;
        bottom: 70px;
        width: 500px;
        height: 170px;
        background: linear-gradient(#63d86d, #36ae53);
        border-radius: 50% 50% 0 0;
        border: 5px solid rgba(48, 120, 58, 0.5);
      }
      .hill-large.left { left: -60px; }
      .hill-large.right { right: -80px; width: 540px; }
      .tree {
        position: absolute;
        bottom: 90px;
        width: 56px;
        height: 86px;
      }
      .tree::before {
        content: "";
        position: absolute;
        left: 13px;
        bottom: 0;
        width: 8px;
        height: 34px;
        background: #7a4c2b;
      }
      .tree::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: 18px;
        width: 56px;
        height: 56px;
        background: linear-gradient(#3fbb5d, #2d9440);
        border-radius: 50%;
        border: 4px solid rgba(38, 118, 52, 0.5);
      }
      .tree.t1 { left: 250px; }
      .tree.t2 { left: 650px; }
      .tree.t3 { right: 230px; }
      .house {
        position: absolute;
        bottom: 90px;
        width: 76px;
        height: 60px;
        background: linear-gradient(#d9bc7a, #b58d54);
        border: 4px solid rgba(88, 60, 35, 0.6);
      }
      .house::before {
        content: "";
        position: absolute;
        left: -8px;
        top: -18px;
        width: 88px;
        height: 24px;
        background: #c3ac7f;
        clip-path: polygon(0 100%, 50% 0, 100% 100%);
      }
      .house.h1 { left: 410px; }
      .house.h2 { right: 410px; }
      .ground {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 92px;
        background: linear-gradient(#8ad95a, #57c93f 55%, #4f9e33 100%);
        border-top: 8px solid rgba(46, 121, 54, 0.72);
      }
      .ground::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        height: 18px;
        background: repeating-linear-gradient(90deg, rgba(255,255,255,0.18) 0 18px, rgba(255,255,255,0.02) 18px 32px);
      }
      .player {
        position: absolute; left: 90px; bottom: 93px; width: 58px; height: 62px;
        border: 4px solid #382a35; border-radius: 46% 46% 28% 28%; display:grid; place-items:center;
        font-size:30px; background:linear-gradient(145deg,#fff0a4,#ffb83f); z-index:12;
        box-shadow:inset 0 -10px #0002,0 6px 0 #382a3533; transform-origin:center bottom;
        transition:transform .12s ease,filter .12s ease;
      }
      .player::before, .player::after {
        content: "";
        position: absolute;
        bottom: -12px;
        width: 10px;
        height: 18px;
        background: rgba(17,16,16,0.8);
        border-radius: 6px;
      }
      .player::before { left: 8px; }
      .player::after { right: 8px; }
      .player.running { animation: runCycle 0.26s steps(2, end) infinite; }
      .player.stopped { animation: none; transform: scale(1.05); }
      @keyframes runCycle {
        0% { transform: translateY(0) rotate(-3deg); }
        25% { transform: translateY(-3px) rotate(2deg); }
        50% { transform: translateY(0) rotate(0deg); }
        75% { transform: translateY(-3px) rotate(-2deg); }
        100% { transform: translateY(0) rotate(3deg); }
      }

      .enemy {
        position:absolute; bottom:90px; width:58px; height:62px; display:grid; place-items:center;
        font-size:30px; border:4px solid #283b52; border-radius:48% 48% 30% 30%;
        background:linear-gradient(145deg,#fff,#b9d9f5); z-index:11;
        box-shadow:inset 0 -9px #0002,0 6px 0 #283b5233;
      }
      .enemy::before{content:"";position:absolute;top:-13px;left:5px;width:18px;height:23px;background:inherit;border:4px solid #283b52;border-radius:90% 10% 60% 10%;transform:rotate(-24deg)}
      .enemy::after{content:"•  •";position:absolute;top:15px;left:10px;font:900 15px Arial;color:#26384b;letter-spacing:3px}
      .enemy.red { background:linear-gradient(145deg,#ffb0a8,#e45b68); }
      .enemy.green { background:linear-gradient(145deg,#c4f5a4,#54b982); }
      .enemy.blue { background:linear-gradient(145deg,#b8e4ff,#548fc8); }
      .enemy.boss { width:88px;height:94px;font-size:42px;border-radius:48% 48% 24% 24%;background:linear-gradient(145deg,#d9b4ff,#8655bb);box-shadow:inset 0 -13px #0002,0 8px 0 #57378a; }
      .enemy.boss::before{width:26px;height:36px;top:-20px;left:7px;box-shadow:42px 0 0 -4px #9a6acb,42px 0 0 0 #283b52}
      .enemy.boss::after{top:25px;left:15px;font-size:19px;letter-spacing:5px;color:#251c38}

      .classic-panel {
        width: min(840px, 92vw);
        background: linear-gradient(#fffbd7, #f1e499);
        border: 8px solid #c99a3d;
        box-shadow: 0 0 0 8px rgba(94, 70, 42, 0.2), 0 16px 0 rgba(87, 68, 37, 0.35);
        padding: 24px 22px 18px;
      }
      .classic-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
        font-size: 12px;
      }
      .classic-question {
        font-size: clamp(18px, 2vw, 32px);
        line-height: 1.5;
        margin: 0 0 20px;
      }
      .classic-answers {
        display: grid;
        gap: 12px;
      }
      .classic-answer {
        width: 100%;
        text-align: left;
        padding: 18px 16px;
        background: rgba(255,255,255,0.75);
        border: 4px solid #6c87a0;
        color: var(--text);
        font-size: 12px;
        line-height: 1.5;
      }
      .classic-answer.correct { border-color: #1ea85b; background: rgba(59, 180, 110, 0.18); }
      .classic-answer.wrong { border-color: #e94848; background: rgba(230, 80, 80, 0.15); }
      .classic-feedback {
        min-height: 32px;
        margin-top: 18px;
        font-size: 12px;
        line-height: 1.8;
      }

      .question-modal {
        position: fixed;
        inset: 0;
        background: rgba(16, 24, 40, 0.6);
        z-index: 50;
        display: grid;
        place-items: center;
        padding: 20px;
      }
      .modal-box {
        width: min(760px, 92vw);
        background: linear-gradient(#fffbd7, #f1e499);
        border: 8px solid #c99a3d;
        box-shadow: 0 0 0 8px rgba(94, 70, 42, 0.2), 0 16px 0 rgba(87, 68, 37, 0.35);
        padding: 26px 22px 20px;
      }
      .question-title {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
        font-size: 12px;
      }
      .question-text {
        font-size: clamp(16px, 2vw, 30px);
        line-height: 1.5;
        margin: 0 0 20px;
      }
      .answer-list { display: grid; gap: 12px; }
      .answer-btn {
        width: 100%;
        text-align: left;
        padding: 18px 16px;
        background: rgba(255,255,255,0.75);
        border: 4px solid #6c87a0;
        color: var(--text);
        font-size: 12px;
        line-height: 1.5;
      }
      .answer-btn.correct { border-color: #1ea85b; background: rgba(59, 180, 110, 0.18); }
      .answer-btn.wrong { border-color: #e94848; background: rgba(230, 80, 80, 0.15); }
      .feedback {
        min-height: 32px;
        margin-top: 18px;
        font-size: 12px;
        line-height: 1.8;
      }
      .close-btn {
        border: 4px solid rgba(34, 50, 59, 0.45);
        background: rgba(255,255,255,0.55);
        color: var(--text);
        padding: 10px 12px;
      }

      @media (max-width: 760px) {
        .character-grid, .subject-grid, .level-grid { grid-template-columns: 1fr; }
        .menu-btn { min-width: 280px; }
        .selection-actions { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <nav class="global-bar" aria-label="App controls">
      <button id="navVillage" class="active" type="button">🏃 Village Run</button>
      <button id="navClassic" type="button">📚 Learning Mode</button>
      
      <span class="spacer"></span>
      <button id="languageToggle" type="button" aria-label="Switch language">العربية</button>
      <button id="themeToggle" type="button" aria-label="Toggle light and dark mode">🌙 Dark</button>
    </nav>
    <div id="titleScreen" class="screen title-screen">
      <div class="pixel-box">
        <div class="cloud c1"></div>
        <div class="cloud c2"></div>
        <div class="cloud c3"></div>
        <div class="hill h1"></div>
        <div class="hill h2"></div>

        <div class="title-block">
          <div class="super">SUPER</div>
          <div class="mario-world">MARIO<br />WORLD</div>
        </div>

        <div class="menu">
          <button class="menu-btn" data-mode="village" id="villageModeBtn">Village Run</button>
          <button class="menu-btn small" id="classicModeBtn">Learning Mode</button>
          
        </div>

        <div class="copyright">© Shola Learning</div>
      </div>
    </div>

    <div id="selectionScreen" class="screen selection-screen hidden">
      <div class="panel">
        <div class="mode-row">
          <button class="mode-btn active" data-mode="village" id="selectVillageMode">Village Runner</button>
          
        </div>

        <h2 class="panel-header">Choose your hero</h2>
        <div class="selector-grid">
          <div id="characterGrid" class="character-grid"></div>

          <h2 class="panel-header" style="margin-top:16px;">Choose subject</h2>
          <div id="subjectGrid" class="subject-grid"></div>

          <h2 class="panel-header" style="margin-top:16px;">Choose level</h2>
          <div id="levelGrid" class="level-grid"></div>
        </div>

        <div class="selection-actions">
          <button class="secondary-btn" id="backBtn">Back</button>
          <button class="primary-btn" id="startAdventureBtn">Start adventure</button>
        </div>
      </div>
    </div>

    <div id="gameScreen" class="screen game-screen hidden">
      <div class="game-shell" id="villageGameShell">
        <div class="hud">
          <div class="hud-box" id="hudSubject">MATH VILLAGE</div>
          <div class="hud-right">
            <div class="hud-box" id="hudLevel">LEVEL 1</div>
            <div class="hud-box" id="hudScore">SCORE 0</div>
            <div class="hud-box"><span class="heart">❤</span> <span id="hudLives">3</span></div>
          </div>
        </div>

        <div class="world" id="world">
          <div class="cloud-sm one"></div>
          <div class="cloud-sm two"></div>
          <div class="cloud-sm three"></div>

          <div class="hill-large left"></div>
          <div class="hill-large right"></div>
          <div class="tree t1"></div>
          <div class="tree t2"></div>
          <div class="tree t3"></div>
          <div class="house h1"></div>
          <div class="house h2"></div>

          <div class="player running" id="player">🧑</div>
          <div id="enemyLayer"></div>
          <div class="ground"></div>
        </div>
      </div>

      <div class="classic-panel hidden" id="classicPanel">
        <div class="classic-header">
          <span id="classicSubject">Math</span>
          <span id="classicStatus">Question 1/3</span>
        </div>
        <div id="classicQuestion" class="classic-question">Question</div>
        <div id="classicAnswers" class="classic-answers"></div>
        <div id="classicFeedback" class="classic-feedback"></div>
      </div>
    </div>

    
    <div id="resultsScreen" class="screen results-screen hidden">
      <section class="results-card">
        <div style="font-size:56px">🏆</div>
        <h1 id="resultsTitle">Adventure complete!</h1>
        <p id="resultsMessage">Great effort. Here are your results.</p>
        <div class="results-score" id="resultsScore">0</div>
        <p id="resultsDetails"></p>
        <div class="results-actions">
          <button class="primary-btn" id="resultsReplay">Play again</button>
          <button class="secondary-btn" id="resultsHome">Main menu</button>
        </div>
      </section>
    </div>
    <div id="questionModal" class="question-modal hidden">
      <div class="modal-box">
        <div class="question-title">
          <span id="questionTag">Math enemy</span>
          <button class="close-btn" id="closeQuestionBtn">Close</button>
        </div>
        <div id="questionText" class="question-text">Question</div>
        <div id="answerList" class="answer-list"></div>
        <div id="feedback" class="feedback"></div>
      </div>
    </div>

    <script>
      const characters = [
        { name: 'Milo', emoji: '🦊', symbol: '🦊', accent: '#a64b27', title: 'Fast runner', subtitle: 'Brave explorer of the village', color: '#ffb347' },
        { name: 'Ava', emoji: '🧙‍♀️', symbol: '🧙🏻‍♀️', accent: '#7655c8', title: 'Smart mage', subtitle: 'Quick with clever answers', color: '#9b7bff' },
        { name: 'Leo', emoji: '🛡️', symbol: '🛡️', accent: '#3d9d78', title: 'Village knight', subtitle: 'Strong and steady defender', color: '#76d9a8' },
        { name: 'Zee', emoji: '🏹', symbol: '🏹', accent: '#3f8dc6', title: 'Quick archer', subtitle: 'Fast in motion and focus', color: '#85d7ff' }
      ];

      const subjects = [
        { name: 'Math', emoji: '🔢', subtitle: 'Numbers, operations, and logic' },
        { name: 'Science', emoji: '🧪', subtitle: 'Nature, planets, and experiments' },
        { name: 'English', emoji: '📚', subtitle: 'Words, grammar, and spelling' },
        { name: 'Arabic', emoji: '🔤', subtitle: 'Language, letters, and meaning' },
        { name: 'Islamic Studies', emoji: '🕌', subtitle: 'Faith, values, and worship' },
        { name: 'Geography', emoji: '🌍', subtitle: 'Places, maps, and countries' }
      ];

      const levels = [
        { name: 'Easy', subtitle: 'Village gate', enemies: 3 },
        { name: 'Medium', subtitle: 'Market trail', enemies: 4 },
        { name: 'Hard', subtitle: 'Stone bridge', enemies: 5 },
        { name: 'Boss', subtitle: 'Final battle', enemies: 1 }
      ];

      const questionBank = {
        Math: [
          { q: 'What is 7 × 6?', a: ['42', '36', '48', '13'], correct: 0 },
          { q: 'What is 45 + 28?', a: ['63', '73', '83', '72'], correct: 1 },
          { q: 'Which fraction is equal to one half?', a: ['2/3', '3/8', '4/8', '1/4'], correct: 2 },
          { q: 'What is 100 − 37?', a: ['73', '67', '63', '53'], correct: 2 },
          { q: 'A triangle has how many sides?', a: ['2', '3', '4', '5'], correct: 1 },
          { q: 'What is 9 × 8?', a: ['72', '64', '81', '69'], correct: 0 }
        ],
        Science: [
          { q: 'Which planet is known as the Red Planet?', a: ['Venus', 'Mars', 'Jupiter', 'Mercury'], correct: 1 },
          { q: 'What do plants absorb from the air?', a: ['Oxygen only', 'Helium', 'Carbon dioxide', 'Hydrogen'], correct: 2 },
          { q: 'What is the chemical formula of water?', a: ['CO₂', 'O₂', 'NaCl', 'H₂O'], correct: 3 },
          { q: 'Which part of the body pumps blood?', a: ['Lungs', 'Brain', 'Heart', 'Stomach'], correct: 2 },
          { q: 'What force pulls objects to Earth?', a: ['Gravity', 'Sound', 'Light', 'Heat'], correct: 0 },
          { q: 'Which state of matter has a fixed shape?', a: ['Gas', 'Liquid', 'Solid', 'Steam'], correct: 2 }
        ],
        English: [
          { q: 'Which word is a noun?', a: ['Quickly', 'Happiness', 'Jump', 'Blue'], correct: 1 },
          { q: 'What is the opposite of ancient?', a: ['Old', 'Historic', 'Modern', 'Past'], correct: 2 },
          { q: 'Choose the correct spelling.', a: ['Beutiful', 'Beautifull', 'Beautiful', 'Butiful'], correct: 2 },
          { q: 'Which word is a verb?', a: ['Swim', 'Table', 'Green', 'Soft'], correct: 0 },
          { q: 'What is the plural of child?', a: ['Childs', 'Children', 'Childes', 'Childrens'], correct: 1 },
          { q: 'Which sentence is a question?', a: ['Where are you?', 'I am here.', 'What a day!', 'Please sit.'], correct: 0 }
        ],
        Arabic: [
          { q: 'ما معنى كلمة «كتاب»؟', a: ['Book', 'Pen', 'Door', 'School'], correct: 0 },
          { q: 'أي حرف تبدأ به كلمة «أسد»؟', a: ['ب', 'أ', 'م', 'س'], correct: 1 },
          { q: 'ما جمع كلمة «قلم»؟', a: ['أقلام', 'قلمان', 'قلمة', 'قلمات'], correct: 0 },
          { q: 'أي كلمة تدل على فعل؟', a: ['مدرسة', 'يكتب', 'جميل', 'كتاب'], correct: 1 },
          { q: 'ما ضد كلمة «كبير»؟', a: ['طويل', 'صغير', 'قريب', 'سريع'], correct: 1 },
          { q: 'كم عدد حروف الهجاء العربية؟', a: ['26', '27', '28', '29'], correct: 2 }
        ],
        'Islamic Studies': [
          { q: 'كم عدد أركان الإسلام؟', a: ['3', '4', '5', '6'], correct: 2 },
          { q: 'ما اسم الكتاب المقدس في الإسلام؟', a: ['القرآن الكريم', 'الإنجيل', 'التوراة', 'الزبور'], correct: 0 },
          { q: 'كم صلاة مفروضة في اليوم والليلة؟', a: ['3', '4', '5', '6'], correct: 2 },
          { q: 'ما الشهر الذي يصوم فيه المسلمون؟', a: ['محرم', 'رمضان', 'شوال', 'رجب'], correct: 1 },
          { q: 'ما التحية الإسلامية؟', a: ['صباح الخير', 'السلام عليكم', 'إلى اللقاء', 'شكراً'], correct: 1 },
          { q: 'ما اسم قبلة المسلمين في الصلاة؟', a: ['المسجد النبوي', 'الكعبة', 'المسجد الأقصى', 'جبل عرفات'], correct: 1 }
        ],
        Geography: [
          { q: 'What is the largest continent?', a: ['Africa', 'Asia', 'Europe', 'Australia'], correct: 1 },
          { q: 'What is the capital city of the UAE?', a: ['Dubai', 'Sharjah', 'Abu Dhabi', 'Ajman'], correct: 2 },
          { q: 'Which ocean is between Africa and Australia?', a: ['Atlantic', 'Arctic', 'Indian', 'Southern'], correct: 2 },
          { q: 'What do maps use to show directions?', a: ['Compass rose', 'Scale bar', 'Legend only', 'Border'], correct: 0 },
          { q: 'Which is a landform with a very high peak?', a: ['Valley', 'Mountain', 'Plain', 'Island'], correct: 1 },
          { q: 'What is a group of islands called?', a: ['Archipelago', 'Peninsula', 'Desert', 'Plateau'], correct: 0 }
        ]
      };

      const state = {
        selectedCharacter: characters[0],
        selectedSubject: subjects[0].name,
        selectedLevel: 0,
        score: 0,
        lives: 3,
        mode: 'village',
        enemiesDefeated: 0,
        totalEnemiesNeeded: 3,
        questionOpen: false,
        animationFrame: null,
        enemyList: [],
        lastSpawn: 0,
        lastTick: 0,
        scrollX: 0,
        classicQuestions: [],
        classicIndex: 0,
        running: false
      };

      const titleScreen = document.getElementById('titleScreen');
      const selectionScreen = document.getElementById('selectionScreen');
      const gameScreen = document.getElementById('gameScreen');
      const questionModal = document.getElementById('questionModal');
      const schoolModeScreen = document.getElementById('schoolModeScreen');
      const resultsScreen = document.getElementById('resultsScreen');
      const enemyLayer = document.getElementById('enemyLayer');
      const playerNode = document.getElementById('player');
      const hudSubject = document.getElementById('hudSubject');
      const hudLevel = document.getElementById('hudLevel');
      const hudScore = document.getElementById('hudScore');
      const hudLives = document.getElementById('hudLives');
      const villageGameShell = document.getElementById('villageGameShell');
      const classicPanel = document.getElementById('classicPanel');
      const classicQuestion = document.getElementById('classicQuestion');
      const classicAnswers = document.getElementById('classicAnswers');
      const classicFeedback = document.getElementById('classicFeedback');
      const classicStatus = document.getElementById('classicStatus');
      const classicSubject = document.getElementById('classicSubject');
      const backgroundItems = Array.from(document.querySelectorAll('.cloud-sm, .hill-large, .tree, .house'));

      function setMode(mode) {
        state.mode = mode;
        document.querySelectorAll('.mode-btn').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.mode === mode);
        });
      }

      function showModePage(mode) {
        const isVillage = mode === 'village';
        titleScreen.classList.add('hidden');
        selectionScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        villageGameShell.classList.toggle('hidden', !isVillage);
        classicPanel.classList.toggle('hidden', isVillage);

        if (isVillage) {
          playerNode.style.left = '90px';
          playerNode.style.bottom = '93px';
          setPlayerRunningState(true);
          resetBackgroundScroll();
          if (state.animationFrame) cancelAnimationFrame(state.animationFrame);
          state.lastTick = performance.now();
          state.lastSpawn = performance.now();
          state.animationFrame = requestAnimationFrame(gameLoop);
        } else {
          prepareClassicQuestions();
          renderClassicQuestion();
        }
      }

      function renderCharacterCards() {
        const grid = document.getElementById('characterGrid');
        grid.innerHTML = '';
        characters.forEach((character, index) => {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'option-card' + (index === 0 ? ' active' : '');
          card.innerHTML = `
            <div class="hero-avatar" style="--hero-color:${character.color};--hero-accent:${character.accent}">${character.symbol}</div>
            <div class="option-title">${character.name}</div>
            <div class="option-sub">${character.title}<br />${character.subtitle}</div>
          `;
          card.addEventListener('click', () => {
            document.querySelectorAll('#characterGrid .option-card').forEach((el) => el.classList.remove('active'));
            card.classList.add('active');
            state.selectedCharacter = character;
            playerNode.textContent = character.emoji;
            playerNode.style.background = character.color;
          });
          grid.appendChild(card);
        });
      }

      function renderSubjectCards() {
        const grid = document.getElementById('subjectGrid');
        grid.innerHTML = '';
        subjects.forEach((subject, index) => {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'option-card' + (index === 0 ? ' active' : '');
          card.innerHTML = `
            <div class="option-emoji">${subject.emoji}</div>
            <div class="option-title">${subject.name}</div>
            <div class="option-sub">${subject.subtitle}</div>
          `;
          card.addEventListener('click', () => {
            document.querySelectorAll('#subjectGrid .option-card').forEach((el) => el.classList.remove('active'));
            card.classList.add('active');
            state.selectedSubject = subject.name;
          });
          grid.appendChild(card);
        });
      }

      function renderLevelCards() {
        const grid = document.getElementById('levelGrid');
        grid.innerHTML = '';
        levels.forEach((level, index) => {
          const card = document.createElement('button');
          card.type = 'button';
          card.className = 'option-card' + (index === 0 ? ' active' : '');
          card.innerHTML = `
            <div class="option-title">${level.name}</div>
            <div class="option-sub">${level.subtitle}</div>
          `;
          card.addEventListener('click', () => {
            document.querySelectorAll('#levelGrid .option-card').forEach((el) => el.classList.remove('active'));
            card.classList.add('active');
            state.selectedLevel = index;
          });
          grid.appendChild(card);
        });
      }

      function updateHud() {
        hudSubject.textContent = `${state.selectedSubject.toUpperCase()} VILLAGE`;
        hudLevel.textContent = `LEVEL ${state.selectedLevel + 1}`;
        hudScore.textContent = `SCORE ${state.score}`;
        hudLives.textContent = state.lives;
      }

      function setPlayerRunningState(isRunning) {
        playerNode.classList.toggle('running', isRunning);
        playerNode.classList.toggle('stopped', !isRunning);
      }

      function resetBackgroundScroll() {
        state.scrollX = 0;
        backgroundItems.forEach((item, index) => {
          item.dataset.speed = String(0.20 + index * 0.06);
          item.style.transform = 'translateX(0px)';
        });
      }

      function updateBackgroundScroll() {
        backgroundItems.forEach((item) => {
          const factor = Number(item.dataset.speed || 0.2);
          item.style.transform = `translateX(${-state.scrollX * factor}px)`;
        });
      }

      function startTitleScreen() {
        titleScreen.classList.remove('hidden');
        selectionScreen.classList.add('hidden');
        gameScreen.classList.add('hidden');
        questionModal.classList.add('hidden');
        state.running = false;
        setPlayerRunningState(false);
      }

      function startSelectionScreen() {
        titleScreen.classList.add('hidden');
        selectionScreen.classList.remove('hidden');
        gameScreen.classList.add('hidden');
      }

      function prepareClassicQuestions() {
        const pool = questionBank[state.selectedSubject] || questionBank.Math;
        state.classicQuestions = [...pool].sort(() => Math.random() - 0.5).slice(0, 3);
        state.classicIndex = 0;
      }

      function renderClassicQuestion() {
        const q = state.classicQuestions[state.classicIndex];
        if (!q) {
          showResults('Classic quiz complete!', state.score, state.classicQuestions.length, 'You finished the Classic Quiz.');
          return;
        }

        classicSubject.textContent = state.selectedSubject;
        classicStatus.textContent = `Question ${state.classicIndex + 1}/${state.classicQuestions.length}`;
        classicQuestion.textContent = q.q;
        classicFeedback.textContent = '';
        classicAnswers.innerHTML = '';

        q.a.forEach((answer, idx) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'classic-answer';
          btn.textContent = `${String.fromCharCode(65 + idx)}. ${answer}`;
          btn.addEventListener('click', () => {
            const isCorrect = idx === q.correct;
            document.querySelectorAll('.classic-answer').forEach((el) => el.disabled = true);
            if (isCorrect) {
              btn.classList.add('correct');
              classicFeedback.textContent = 'Correct!';
              state.score += 50;
            } else {
              btn.classList.add('wrong');
              classicFeedback.textContent = 'Wrong answer!';
              state.lives = Math.max(0, state.lives - 1);
            }
            setTimeout(() => {
              state.classicIndex += 1;
              if (state.classicIndex < state.classicQuestions.length) {
                renderClassicQuestion();
              } else {
                showResults('Classic quiz complete!', state.score, state.classicQuestions.length, 'You finished the Classic Quiz.');
              }
            }, 800);
          });
          classicAnswers.appendChild(btn);
        });
      }

      function startGame() {
        state.score = 0;
        state.lives = 3;
        state.enemiesDefeated = 0;
        state.totalEnemiesNeeded = levels[state.selectedLevel].enemies;
        state.enemyList = [];
        state.questionOpen = false;
        state.running = true;
        state.scrollX = 0;
        updateHud();
        document.getElementById('enemyLayer').innerHTML = '';

        titleScreen.classList.add('hidden');
        selectionScreen.classList.add('hidden');
        gameScreen.classList.remove('hidden');
        questionModal.classList.add('hidden');

        if (state.mode === 'classic') {
          villageGameShell.classList.add('hidden');
          classicPanel.classList.remove('hidden');
          prepareClassicQuestions();
          renderClassicQuestion();
          return;
        }

        villageGameShell.classList.remove('hidden');
        classicPanel.classList.add('hidden');
        playerNode.style.left = '90px';
        playerNode.style.bottom = '93px';
        setPlayerRunningState(true);
        resetBackgroundScroll();

        if (state.animationFrame) cancelAnimationFrame(state.animationFrame);
        state.lastTick = performance.now();
        state.lastSpawn = performance.now();
        state.animationFrame = requestAnimationFrame(gameLoop);
      }

      function getRandomQuestion() {
        const pool = questionBank[state.selectedSubject] || questionBank.Math;
        return pool[Math.floor(Math.random() * pool.length)];
      }

      function spawnEnemy() {
        if (!state.running || state.questionOpen) return;
        const enemyTypes = ['red', 'green', 'blue'];
        const enemyType = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
        const enemy = document.createElement('div');
        enemy.className = `enemy ${enemyType}${state.selectedLevel === 3 ? ' boss' : ''}`;
        enemy.innerHTML = state.selectedLevel === 3 ? '👹' : '🦹';
        enemy.style.left = '980px';
        enemyLayer.appendChild(enemy);

        state.enemyList.push({
          element: enemy,
          x: 980,
          speed: state.selectedLevel === 3 ? 220 : 180 + Math.random() * 60,
          defeated: false
        });
      }

      function openQuestion(enemyObj) {
        if (state.questionOpen) return;
        state.questionOpen = true;
        setPlayerRunningState(false);

        const q = getRandomQuestion();
        enemyObj.element.style.transform = 'scale(1.08)';

        const questionText = document.getElementById('questionText');
        const answerList = document.getElementById('answerList');
        const feedback = document.getElementById('feedback');
        const tag = document.getElementById('questionTag');

        tag.textContent = `${state.selectedSubject.toUpperCase()} enemy`;
        questionText.textContent = q.q;
        answerList.innerHTML = '';
        feedback.textContent = '';

        q.a.forEach((answer, idx) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'answer-btn';
          btn.textContent = `${String.fromCharCode(65 + idx)}. ${answer}`;
          btn.addEventListener('click', () => {
            const isCorrect = idx === q.correct;
            document.querySelectorAll('.answer-btn').forEach((el) => el.disabled = true);
            if (isCorrect) {
              btn.classList.add('correct');
              feedback.textContent = 'Correct! Enemy defeated!';
              state.score += 25;
              state.enemiesDefeated += 1;
              enemyObj.defeated = true;
              setTimeout(() => {
                if (state.enemiesDefeated >= state.totalEnemiesNeeded) {
                  showResults('Village run complete!', state.score, state.totalEnemiesNeeded, 'You cleared every challenge in this level!');
                  return;
                }
                questionModal.classList.add('hidden');
                state.questionOpen = false;
                setPlayerRunningState(true);
                enemyObj.element.remove();
              }, 700);
            } else {
              btn.classList.add('wrong');
              feedback.textContent = 'Wrong answer! Enemy still stands.';
              state.lives = Math.max(0, state.lives - 1);
              setTimeout(() => {
                questionModal.classList.add('hidden');
                state.questionOpen = false;
                setPlayerRunningState(true);
                if (state.lives <= 0) {
                  showResults('Game over', state.score, state.enemiesDefeated, 'Good try! Practise and come back stronger.');
                }
              }, 700);
            }
          });
          answerList.appendChild(btn);
        });

        questionModal.classList.remove('hidden');
      }

      function gameLoop(now) {
        if (!state.running || state.mode !== 'village') return;

        const dt = (now - state.lastTick) / 1000;
        state.lastTick = now;

        if (!state.questionOpen) {
          state.scrollX += 180 * dt;
          updateBackgroundScroll();

          if (now - state.lastSpawn > 1700) {
            spawnEnemy();
            state.lastSpawn = now;
          }

          for (const enemy of state.enemyList) {
            enemy.x -= enemy.speed * dt;
            enemy.element.style.left = `${enemy.x}px`;

            const playerX = 90;
            const touching = enemy.x < playerX + 56 && enemy.x + 52 > playerX;
            if (touching) {
              openQuestion(enemy);
            }
          }

          state.enemyList = state.enemyList.filter((enemy) => {
            const stillVisible = enemy.x + 64 > -10;
            if (!stillVisible) enemy.element.remove();
            return stillVisible;
          });
        }

        state.animationFrame = requestAnimationFrame(gameLoop);
      }

      document.getElementById('villageModeBtn').addEventListener('click', () => {
        setMode('village');
        startSelectionScreen();
      });
      document.getElementById('classicModeBtn').addEventListener('click', () => { window.location.href = 'Learning-Mode.html'; });
      document.getElementById('selectVillageMode').addEventListener('click', () => setMode('village'));
      document.getElementById('backBtn').addEventListener('click', startTitleScreen);
      document.getElementById('startAdventureBtn').addEventListener('click', startGame);
      document.getElementById('closeQuestionBtn').addEventListener('click', () => {
        questionModal.classList.add('hidden');
        state.questionOpen = false;
        setPlayerRunningState(true);
      });


      function showResults(title, score, total, message) {
        state.running = false;
        if (state.animationFrame) cancelAnimationFrame(state.animationFrame);
        setPlayerRunningState(false);
        titleScreen.classList.add('hidden'); selectionScreen.classList.add('hidden');
        gameScreen.classList.add('hidden'); questionModal.classList.add('hidden');
         resultsScreen.classList.remove('hidden');
        document.getElementById('resultsTitle').textContent = title;
        document.getElementById('resultsMessage').textContent = message || 'Great effort. Here are your results.';
        document.getElementById('resultsScore').textContent = state.mode === 'classic' ? score + ' pts' : score + ' pts';
        document.getElementById('resultsDetails').textContent = total ? (score + ' points • ' + total + ' questions / challenges') : (state.enemiesDefeated + ' challenges completed');
        document.getElementById('resultsReplay').onclick = () => { resultsScreen.classList.add('hidden'); startSelectionScreen(); };
      }
      function setNavActive(which) {
        [['village','navVillage'],['classic','navClassic']].forEach(([key,id]) => document.getElementById(id).classList.toggle('active',key===which));
      }
      document.getElementById('navVillage').onclick = () => { setMode('village'); resultsScreen.classList.add('hidden'); startSelectionScreen(); setNavActive('village'); };
      document.getElementById('navClassic').onclick = () => { window.location.href = 'Learning-Mode.html'; };
      
      document.getElementById('resultsHome').onclick = () => { resultsScreen.classList.add('hidden'); startTitleScreen(); setNavActive('village'); };
      document.getElementById('languageToggle').onclick = () => {
        const ar = document.documentElement.lang !== 'ar';
        document.documentElement.lang = ar ? 'ar' : 'en';
        document.documentElement.dir = ar ? 'rtl' : 'ltr';
        document.getElementById('languageToggle').textContent = ar ? 'English' : 'العربية';
        document.getElementById('navVillage').textContent = ar ? '🏃 جولة القرية' : '🏃 Village Run';
        document.getElementById('navClassic').textContent = ar ? '📚 وضع التعلّم' : '📚 Learning Mode';
        
        document.getElementById('themeToggle').textContent = document.documentElement.classList.contains('dark-theme') ? (ar ? '☀ فاتح' : '☀ Light') : (ar ? '🌙 داكن' : '🌙 Dark');
      };
      try {
        const savedTheme = localStorage.getItem('learnquest-theme');
        document.documentElement.classList.toggle('dark-theme', savedTheme === 'dark');
      } catch(e) {}
      document.getElementById('themeToggle').textContent = document.documentElement.classList.contains('dark-theme') ? '☀ Light' : '🌙 Dark';
      document.getElementById('themeToggle').onclick = () => {
        const dark = !document.documentElement.classList.contains('dark-theme');
        document.documentElement.classList.toggle('dark-theme', dark);
        try { localStorage.setItem('learnquest-theme', dark ? 'dark' : 'light'); } catch(e) {}
        document.getElementById('themeToggle').textContent = dark ? '☀ Light' : '🌙 Dark';
      };
      renderCharacterCards();
      renderSubjectCards();
      renderLevelCards();
      updateHud();
      resetBackgroundScroll();
      setMode('village');
      setPlayerRunningState(true);
      document.getElementById('navVillage').classList.add('active');
    </script>
    <script src="level-lock.js"></script>
</body>
</html>
